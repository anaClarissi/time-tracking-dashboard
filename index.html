<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Time tracking dashboard website">
  <meta name="keywords" content="html, css, javascript, bootstrap">
  <meta name="author" content="Ana Clarissi">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body data-title="daily">

  <main class="main">

    <div class="container">

      <div class="grid-cards">

        <div class="card main-card">

          <div class="card-header">

            <img src="/src/assets/images/image-jeremy.png" alt="Black guy with locs and smaling" class="card-header--img">

            <p class="subtitle">Report for</p>

            <h3 class="title">Jeremy Robson</h3>

          </div>

          <nav class="card-nav">
            
            <ul class="main-list">

              <li class="main-item"><a href="#" class="main-link active" id="daily">Daily</a></li>
              <li class="main-item"><a href="#" class="main-link" id="weekly">Weekly</a></li>
              <li class="main-item"><a href="#" class="main-link" id="monthly">Monthly</a></li>

            </ul>
            
          </nav>

        </div>

        <div class="card work-card" title="Work">

          <div class="card-body">

            <div class="card-primary-content">

              <h3 class="title"></h3>

              <button type="button" class="btn-ellipsi">
                <img src="/src/assets/images/icon-ellipsis.svg" alt="Ellipsi Icon" class="ellipsi-icon">
              </button>

            </div>

            <div class="card-secondary-content">

              <span class="current-data" aria-label="current"></span>

              <span class="previous-data" aria-label="previous"></span>

            </div>

          </div>

        </div>

        <div class="card play-card" title="Play">

          <div class="card-body">

            <div class="card-primary-content">

              <h3 class="title"></h3>

              <button type="button" class="btn-ellipsi">
                <img src="/src/assets/images/icon-ellipsis.svg" alt="Ellipsi Icon" class="ellipsi-icon">
              </button>

            </div>

            <div class="card-secondary-content">

              <span class="current-data" aria-label="current"></span>

              <span class="previous-data" aria-label="previous"></span>

            </div>
          
          </div>

        </div>

        <div class="card study-card" title="Study">

          <div class="card-body">

            <div class="card-primary-content">

              <h3 class="title"></h3>

              <button type="button" class="btn-ellipsi">
                <img src="/src/assets/images/icon-ellipsis.svg" alt="Ellipsi Icon" class="ellipsi-icon">
              </button>

            </div>

            <div class="card-secondary-content">

              <span class="current-data" aria-label="current"></span>

              <span class="previous-data" aria-label="previous"></span>

            </div>

          </div>

        </div>

        <div class="card exercise-card" title="Exercise">

          <div class="card-body">

            <div class="card-primary-content">

              <h3 class="title"></h3>

              <button type="button" class="btn-ellipsi">
                <img src="/src/assets/images/icon-ellipsis.svg" alt="Ellipsi Icon" class="ellipsi-icon">
              </button>

            </div>

            <div class="card-secondary-content">

              <span class="current-data" aria-label="current"></span>

              <span class="previous-data" aria-label="previous"></span>

            </div>

          </div>

        </div>

        <div class="card social-card" title="Social">

          <div class="card-body">

            <div class="card-primary-content">

              <h3 class="title"></h3>

              <button type="button" class="btn-ellipsi">
                <img src="/src/assets/images/icon-ellipsis.svg" alt="Ellipsi Icon" class="ellipsi-icon">
              </button>

            </div>

            <div class="card-secondary-content">

              <span class="current-data" aria-label="current"></span>

              <span class="previous-data" aria-label="previous"></span>

            </div>

          </div>

        </div>

        <div class="card self-card" title="Self Care">

          <div class="card-body">

            <div class="card-primary-content">

              <h3 class="title"></h3>

              <button type="button" class="btn-ellipsi">
                <img src="/src/assets/images/icon-ellipsis.svg" alt="Ellipsi Icon" class="ellipsi-icon">
              </button>

            </div>

            <div class="card-secondary-content">

              <span class="current-data" aria-label="current"></span>

              <span class="previous-data" aria-label="previous"></span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

  <script type="module" src="/src/js/main.js"></script>

</body>
</html>
